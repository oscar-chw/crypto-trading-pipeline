[mypy]
python_version = 3.11
check_untyped_defs = True
mypy_path = reference:third_party/crypto-desk-blueprint
explicit_package_bases = True
# The vendored blueprint is checked in its own repo; here it is only an import.
follow_imports = silent
files = reference/adapters, reference/backtest, reference/bot/api/exchange.py, reference/tests/case/test_exchange.py, reference/bot/console/slow_stop.py, reference/tests/case/test_indicators.py, reference/tests/case/test_recorder.py
