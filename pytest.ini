[pytest]
# One marker per tier; check.sh runs each tier alone and fails a tier that collects nothing.
addopts = --strict-markers -p no:cacheprovider
pythonpath = reference third_party/crypto-desk-blueprint
markers =
    case: one unit, one behaviour
    integration: crosses a real boundary (the live loop, a subprocess, files on disk)
    property: an invariant over generated inputs (hypothesis)
